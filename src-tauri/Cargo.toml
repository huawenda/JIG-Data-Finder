[package]
name = "jig-data-finder"
version = "2.0.0"
description = "JIG Data Finder - MES JIG 数据查询助手"
authors = ["Huawenda"]
edition = "2021"
rust-version = "1.77"

[lib]
name = "jig_data_finder_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[features]
# 默认关闭, 减小体积; cargo tauri build --features custom-protocol
default = []
custom-protocol = ["tauri/custom-protocol"]

# release 用于发布 (体积最小), dev-profile 用于日常迭代。
#
# 取舍说明:
#   fat-lto  + codegen-units=1 -> 每次链接 15-25 分钟, 因为改一行前端 JS
#                             也要重跑全程序优化, 迭代无法忍受。
#   thin-lto + codegen-units=16 -> 约 1-2 分钟, 体积只大几百 KB。
# 桌面应用的 exe 本就只有几 MB, 那点差异无感知, 所以选后者。
[profile.release]
panic = "abort"
codegen-units = 16
lto = "thin"
opt-level = "s"
strip = true

# 正式发布时用: cargo tauri build --profile dist
# 体积更小, 但只在发版前跑一次。
[profile.dist]
inherits = "release"
codegen-units = 1
lto = "fat"
opt-level = "s"
strip = true
