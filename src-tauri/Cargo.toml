[package]
name = "jig-data-finder"
version = "2.0.0"
description = "JIG Data Finder - MES JIG 数据查询助手"
authors = ["Huawenda"]
edition = "2021"
rust-version = "1.77"

[lib]
name = "jig_data_finder_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[features]
# 默认关闭, 减小体积; cargo tauri build --features custom-protocol
default = []
custom-protocol = ["tauri/custom-protocol"]

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
